use_nextlat: true

trainer:
  train_batches: 100000
  val_batches: -1
  val_only: false
  val_printsamples: false
  log_interval: 10
  val_interval: 1000
  test_interval: 1000
  save_last_checkpoint: true
  save_best_checkpoint: true
  always_save_checkpoint: false
  save_recovery_checkpoint: -1
  keep_checkpoint_steps: []
  out_dir: output/tinystories
  init_from: scratch
  log_to_file: true
  log_to_wandb: true
  wandb_project: tinystories
  compile: true
  use_fused_kernels: false
  garbage_collect: -1
  sampling_mode: AR
  experiment_name: NextLat
data:
  dataset: tinystories
  effective_batch_size: 256
  gradient_accum_steps: 1
  pair_batch_size: 32768
  num_workers: 0
  tokenizer_name_or_path: ''
  tokenizer_eos_id: -1
  stargraph_data_path: ''
  stargraph_max_nodes: 50
  device_batch_size: 256
  micro_batch_size: 256
model:
  n_layer: 8
  n_head: 8
  n_embd: 768
  dropout: 0.0
  bias: false
  vocab_size: 1000
  block_size: 256
  context_length: 0
  bst_pair_minimum_gap: 1
  bst_pair_maximum_gap: -1
  bst_pair_subsample_rate: 1.0
  bst_single_gap_prediction_mode: eos
  gpt_mode: next_token
  lambda_kl: 0.5
  mtp_horizon: 1
  lambda_mse: 1.0
optimizer:
  learning_rate: 0.0003
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
lr_scheduler:
  warmup_iters: 0
  warmdown_iters: 0
seed: 1234
sweep:
  - model:
      mtp_horizon: [1, 8]
      lambda_kl: [1.0]
      proj_factor: [1.3]
      lambda_mse: [1.0]